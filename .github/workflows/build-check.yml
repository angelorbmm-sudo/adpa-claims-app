name: ADPA Build Check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund
      - run: npm run build
      - name: Run domain regression tests
        run: npm test
      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/routes/claims.js
          node --check server/routes/migration.js
          node --check server/routes/documents.js
          node --check server/compliance.js
          node --check server/financial.js
